# Rebuild and upload the shared Cogs vs Clips and Four Score Coworld from this
# repository's checked-in sources.
#
# Required repository secret:
#   SOFTMAX_API_TOKEN - a team usr_ token for https://softmax.com/api.
# Coworld 0.1.69 owns the source build and static replay bundle lifecycle.
name: Deploy CogsGuard Coworld

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!coworld/player/**'
      - '!src/cogsguard/semantic/systemone.py'
      - '!tools/export_semantic_trajectory.py'
      - '!tests/**'
      - '!README.md'
      - '!Dockerfile.systemone-player'
      - '!.github/workflows/deploy-game.yml'
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and certify artifacts for upload from another machine
        type: boolean
        default: false
      version:
        description: Explicit Coworld version (required for build-only)
        type: string
        required: false

concurrency:
  group: deploy-game
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SOFTMAX_OBSERVATORY
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v3

      - name: Install Coworld lifecycle CLI
        run: python -m pip install "coworld==0.1.69"

      - name: Install pinned Polyworld browser toolchain
        run: |
          curl -fsSL https://github.com/nim-lang/nightlies/releases/download/2026-04-24-version-2-2-bfeb3146d1638b39f69007a4ae5a23e23ae4e5ef/nim-2.2.10-linux_x64.tar.xz | tar xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/nim-2.2.10/bin" >> "${GITHUB_PATH}"
          git clone --branch 4.0.15 --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          "${RUNNER_TEMP}/emsdk/emsdk" install 4.0.15
          "${RUNNER_TEMP}/emsdk/emsdk" activate 4.0.15

      - name: Seed Softmax credentials
        if: ${{ !inputs.build_only }}
        env:
          SOFTMAX_API_TOKEN: ${{ secrets.SOFTMAX_API_TOKEN }}
        run: |
          if [[ -z "${SOFTMAX_API_TOKEN}" ]]; then
            echo "::error::SOFTMAX_API_TOKEN is empty"
            exit 1
          fi
          softmax set-token "${SOFTMAX_API_TOKEN}" --server https://softmax.com/api
          python -c "from softmax.auth import clear_active_player_session; clear_active_player_session(server='https://softmax.com/api')"

      - name: Resolve next Coworld version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "value=${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
          elif [[ "${BUILD_ONLY}" == "true" ]]; then
            echo "::error::Build-only releases require an explicit version"
            exit 1
          else
            echo "value=$(coworld next-version cogs_vs_clips)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and certify
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          coworld build --version "${{ steps.version.outputs.value }}"
          coworld certify dist/coworld_manifest.json

      - name: Upload and check hosted certification
        if: ${{ !inputs.build_only }}
        run: coworld upload-coworld dist/coworld_manifest.json

      - name: Export built images
        if: ${{ inputs.build_only }}
        run: |
          python - <<'PYEXPORT'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path("dist/coworld_manifest.json").read_text())
          runnables = [manifest["game"]["runnable"]]
          runnables.extend(v["game_runnable"] for v in manifest["variants"] if v.get("game_runnable"))
          for role in ["player", "commissioner", "grader", "diagnoser", "optimizer"]:
              runnables.extend(manifest.get(role, []))
          images = sorted({r["image"] for r in runnables if "image" in r})
          subprocess.run(["docker", "image", "save", "--output", "dist/images.tar", *images], check=True)
          PYEXPORT
          gzip dist/images.tar
          sha256sum dist/images.tar.gz > dist/images.tar.gz.sha256
          du -h dist/images.tar.gz

      - name: Retain certified release artifacts
        if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: cogs-vs-clips-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7
