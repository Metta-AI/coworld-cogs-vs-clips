# Rebuild and upload Cogs vs Clips from this repository's checked-in sources.
#
# Required repository secret:
#   SOFTMAX_API_TOKEN - a team usr_ token for https://softmax.com/api.
# Coworld 0.1.34 is the first release expected to include static replay bundles.
name: Deploy Cogs vs Clips

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-game
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SOFTMAX_OBSERVATORY
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v3

      - name: Install Coworld lifecycle CLI
        run: >-
          python -m pip install
          "coworld>=0.1.34"

      - name: Seed Softmax credentials
        env:
          SOFTMAX_API_TOKEN: ${{ secrets.SOFTMAX_API_TOKEN }}
        run: |
          if [[ -z "${SOFTMAX_API_TOKEN}" ]]; then
            echo "::error::SOFTMAX_API_TOKEN is empty"
            exit 1
          fi
          softmax set-token "${SOFTMAX_API_TOKEN}" --server https://softmax.com/api
          python -c "from softmax.auth import clear_active_player_session; clear_active_player_session(server='https://softmax.com/api')"

      - name: Resolve next Coworld version
        id: version
        run: echo "value=$(coworld next-version cogs_vs_clips)" >> "${GITHUB_OUTPUT}"

      - name: Build, resolve, certify, and upload
        run: |
          coworld resolve-and-upload \
            compose.yaml \
            coworld_manifest_template.json \
            "${{ steps.version.outputs.value }}" \
            dist/coworld_manifest.json \
            --source-context .
