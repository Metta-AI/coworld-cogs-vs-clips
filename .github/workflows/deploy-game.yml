# Rebuild and upload the shared Cogs vs Clips and Four Score Coworld from this
# repository's checked-in sources.
#
# Required repository secret:
#   SOFTMAX_API_TOKEN - a team usr_ token for https://softmax.com/api.
# Coworld 0.1.69 owns the source build and static replay bundle lifecycle.
name: Deploy CogsGuard Coworld

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!coworld/player/**'
      - '!src/cogsguard/semantic/systemone.py'
      - '!tools/export_semantic_trajectory.py'
      - '!tests/**'
      - '!README.md'
      - '!Dockerfile.systemone-player'
      - '!.github/workflows/deploy-game.yml'
  workflow_dispatch:

concurrency:
  group: deploy-game
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SOFTMAX_OBSERVATORY
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v3

      - name: Install Coworld lifecycle CLI
        run: python -m pip install "coworld==0.1.69"

      - name: Install pinned Polyworld browser toolchain
        run: |
          curl -fsSL https://github.com/nim-lang/nightlies/releases/download/2026-04-24-version-2-2-bfeb3146d1638b39f69007a4ae5a23e23ae4e5ef/nim-2.2.10-linux_x64.tar.xz | tar xJ -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/nim-2.2.10/bin" >> "${GITHUB_PATH}"
          git clone --branch 4.0.15 --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          "${RUNNER_TEMP}/emsdk/emsdk" install 4.0.15
          "${RUNNER_TEMP}/emsdk/emsdk" activate 4.0.15

      - name: Seed Softmax credentials
        env:
          SOFTMAX_API_TOKEN: ${{ secrets.SOFTMAX_API_TOKEN }}
        run: |
          if [[ -z "${SOFTMAX_API_TOKEN}" ]]; then
            echo "::error::SOFTMAX_API_TOKEN is empty"
            exit 1
          fi
          softmax set-token "${SOFTMAX_API_TOKEN}" --server https://softmax.com/api
          python -c "from softmax.auth import clear_active_player_session; clear_active_player_session(server='https://softmax.com/api')"

      - name: Resolve next Coworld version
        id: version
        run: echo "value=$(coworld next-version cogs_vs_clips)" >> "${GITHUB_OUTPUT}"

      - name: Build, certify, and upload
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          coworld build --version "${{ steps.version.outputs.value }}"
          coworld certify dist/coworld_manifest.json
          coworld upload-coworld dist/coworld_manifest.json
