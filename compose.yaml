services:
  game:
    image: coworld-cogs-vs-clips-game:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.game
      args:
        METTASCOPE_BUILDER_PLATFORM: linux/amd64
        GAME_RUNTIME_PLATFORM: linux/amd64
  player:
    image: coworld-cogs-vs-clips-reference-player:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.player
      args:
        PLAYER_RUNTIME_PLATFORM: linux/amd64
  reporter:
    image: ghcr.io/metta-ai/reporters-default:latest
    platform: linux/amd64
  cogs-vs-clips-reporter:
    image: ghcr.io/metta-ai/reporters-cogs-vs-clips-summarizer:latest
    platform: linux/amd64
  grader:
    image: ghcr.io/metta-ai/graders-cogs-v-clips:latest
    platform: linux/amd64
  cogs-vs-clips-commissioner:
    image: ghcr.io/metta-ai/commissioners-cogs-vs-clips@sha256:9cba7a30dffe572893883a035a346d866ee24b21be358540fd024ddcd58c43dd
    platform: linux/amd64
