services:
  game:
    image: coworld-cogs-vs-clips-game:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.game
      args:
        METTASCOPE_BUILDER_PLATFORM: linux/amd64
        GAME_RUNTIME_PLATFORM: linux/amd64
  player:
    image: coworld-cogs-vs-clips-reference-player:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.player
      args:
        PLAYER_RUNTIME_PLATFORM: linux/amd64
  cogs-vs-clips-commissioner:
    image: coworld-cogs-vs-clips-commissioner:latest
    platform: linux/amd64
    build:
      context: ./commissioner
      dockerfile: commissioners/Dockerfile
      args:
        COMMISSIONER_KEY: config_driven
        RULESET_STRATEGY_CONFIG_NAME: cogs_vs_clips
  four-score-commissioner:
    image: coworld-four-score-commissioner:latest
    platform: linux/amd64
    build:
      context: ./commissioner
      dockerfile: commissioners/Dockerfile
      args:
        COMMISSIONER_KEY: config_driven
        RULESET_STRATEGY_CONFIG_NAME: four_score
  polyworld-cooperative:
    image: coworld-cogs-vs-clips-polyworld-cooperative:latest
    platform: linux/amd64
    build:
      context: ./vendor/polyworld-cogs-vs-clips
      dockerfile: coworld/Dockerfile
      args:
        POLYWORLD_REVISION: ${POLYWORLD_REVISION:?Run tools/build.sh to resolve Polyworld}
        COOPERATIVE: "1"
  polyworld-fourscore:
    image: coworld-cogs-vs-clips-polyworld-fourscore:latest
    platform: linux/amd64
    build:
      context: ./vendor/polyworld-cogs-vs-clips
      dockerfile: coworld/Dockerfile
      args:
        POLYWORLD_REVISION: ${POLYWORLD_REVISION:?Run tools/build.sh to resolve Polyworld}
        COOPERATIVE: "0"
